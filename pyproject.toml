[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alerce-classifier"
version = "0.1.0"
description = "ALeRCE ZTF light-curve classifier"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "pyvo",
    "scikit-learn",
    "torch",
]

[project.optional-dependencies]
app = [
    "plotly",
    "streamlit",
]
dev = [
    "jupyter",
    "pytest",
]
training = [
    "matplotlib",
    "seaborn",
]

[tool.setuptools.packages.find]
where = ["src"]
